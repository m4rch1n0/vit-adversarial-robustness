# ── Data ──────────────────────────────────────────────────────────────────
data:
  path: ./data/imagenette2-160
  batch_size: 64
  workers: 4
  image_size: 224

# ── Model ─────────────────────────────────────────────────────────────────
model:
  arch: vit                     # vit | resnet18 | resnet50
  name: vit_base_patch16_224.orig_in21k_ft_in1k
  pretrained: true
  num_classes: 10
  strategy: linear_probe        # linear_probe | full

# ── Training ──────────────────────────────────────────────────────────────
training:
  epochs: 10
  lr: 1.0e-3
  lr_backbone: 1.0e-5           # only used when strategy=full
  weight_decay: 0.01
  scheduler: cosine

# ── Attacks ───────────────────────────────────────────────────────────────
attacks:
  eps_255: [0, 1, 2, 4, 8, 16]
  pgd:
    steps: 10
  patch_pgd:
    steps: 10
    patch_size: 64
    position: center
  salient_patch_pgd:
    steps: 10
    vit_patch_size: 16
    top_k: 20

# ── Evaluation ────────────────────────────────────────────────────────────
eval:
  compute_calibration: true

# ── Reproducibility ───────────────────────────────────────────────────────
seed: 42
device: cuda
output_dir: ./experiments
